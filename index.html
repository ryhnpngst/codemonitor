<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const stored = localStorage.getItem("color-scheme") || localStorage.getItem("theme");
        const resolved = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.querySelector('meta[name="color-scheme"]').content = stored || "light dark";
        if (resolved === "light") {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeMonitor — Platform Praktik & Monitoring Pemrograman Siswa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="h-full font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
